services:
  db:
    image: postgis/postgis:16-3.4
    container_name: buyersclub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buyersclub
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d buyersclub']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: buyersclub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  storage:
    image: motoserver/moto:latest
    container_name: buyersclub-storage
    restart: unless-stopped
    ports:
      - '9000:5000'
    environment:
      MOTO_PORT: '5000'
      AWS_DEFAULT_REGION: us-east-1

  mailpit:
    image: axllent/mailpit:latest
    container_name: buyersclub-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db-data:
  redis-data:
